spring.application.name=health-platform

# ---- MySQL Connection ----
spring.datasource.url=jdbc:mysql://localhost:3306/rural_health_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" will auto-create/alter tables from the entities on startup.
# Set to "validate" once you have run schema.sql yourself in Stage 1.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# schema.sql is provided as a manual reference/Stage-1 script only.
# Hibernate (ddl-auto=update) manages the schema automatically at runtime,
# so we disable Spring's automatic schema.sql execution to avoid conflicts.
spring.sql.init.mode=never

# ---- Server ----
server.port=8080

spring.application.name=health-platform

# ---- Local dev DB ----
# Default to H2 so the app runs in this environment without requiring a local MySQL install.
# For MySQL, override DB_URL/DB_USERNAME/DB_PASSWORD or set DB_DRIVER/DB_DIALECT as needed.
spring.datasource.url=${DB_URL:jdbc:h2:mem:health_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ---- JPA / Hibernate ----
# "update" will auto-create/alter tables from the entities on startup.
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# schema.sql is provided as a manual reference/Stage-1 script only.
# Hibernate (ddl-auto=update) manages the schema automatically at runtime,
# so we disable Spring's automatic schema.sql execution to avoid conflicts.
spring.sql.init.mode=never

# ---- Development users (override these environment variables before deployment) ----
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.accountant.username=${ACCOUNTANT_USERNAME:accountant}
app.security.accountant.password=${ACCOUNTANT_PASSWORD:accountant123}

# ---- Server ----
server.address=0.0.0.0
server.port=8081
server.forward-headers-strategy=framework

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patients · Rural Health Network Platform</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Rural Health Network</div>
    <div class="brand-sub">Patient &amp; Clinic Management</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="patients.html" class="active">Patients</a>
      <a href="triage.html">Triage Queue</a>
      <a href="billing.html">Billing</a>
      <a href="budget.html">Budgets</a>
      <a href="reports.html">Reports</a>
    </nav>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Patient intake</h1>
        <p>Register new patients and browse existing records.</p>
      </div>
    </div>

    <div id="form-msg"></div>

    <div class="card">
      <h2>Register a patient</h2>
      <form id="patient-form">
        <div class="form-grid">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" required>
          </div>
          <div class="field">
            <label for="dateOfBirth">Date of birth</label>
            <input type="date" id="dateOfBirth">
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="">—</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input type="text" id="phone">
          </div>
          <div class="field">
            <label for="bloodGroup">Blood group</label>
            <input type="text" id="bloodGroup" placeholder="e.g. O+">
          </div>
          <div class="field">
            <label for="emergencyContact">Emergency contact</label>
            <input type="text" id="emergencyContact">
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label for="address">Address</label>
            <input type="text" id="address">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Register patient</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>All patients</h2>
      <table id="patients-table">
        <thead>
          <tr><th class="num">ID</th><th>Name</th><th>DOB</th><th>Gender</th><th>Phone</th><th>Blood Group</th></tr>
        </thead>
        <tbody><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/patients.js"></script>
</body>
</html>

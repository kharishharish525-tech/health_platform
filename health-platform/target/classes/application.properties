spring.application.name=health-platform

# ---- Local dev DB ----
# Use an embedded H2 database in this workspace so the app can run without a local MySQL server.
spring.datasource.url=jdbc:h2:mem:rural_health_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---- JPA / Hibernate ----
# "update" will auto-create/alter tables from the entities on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# schema.sql is provided as a manual reference/Stage-1 script only.
# Hibernate (ddl-auto=update) manages the schema automatically at runtime,
# so we disable Spring's automatic schema.sql execution to avoid conflicts.
spring.sql.init.mode=never

# ---- Server ----
server.port=8081

spring.application.name=health-platform

# ---- Local dev DB ----
# MySQL is the runtime database; override DB_URL/DB_USERNAME/DB_PASSWORD as needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rural_health_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate ----
# "update" will auto-create/alter tables from the entities on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# schema.sql is provided as a manual reference/Stage-1 script only.
# Hibernate (ddl-auto=update) manages the schema automatically at runtime,
# so we disable Spring's automatic schema.sql execution to avoid conflicts.
spring.sql.init.mode=never

# ---- Development users (override these environment variables before deployment) ----
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.accountant.username=${ACCOUNTANT_USERNAME:accountant}
app.security.accountant.password=${ACCOUNTANT_PASSWORD:accountant123}

# ---- Server ----
server.address=0.0.0.0
server.port=8081
server.forward-headers-strategy=framework
